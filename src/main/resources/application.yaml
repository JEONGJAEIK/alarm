spring:
  application:
    name: alarm
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alarm?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&sessionVariables=transaction_isolation='READ-COMMITTED'}
    username: ${SPRING_DATASOURCE_USERNAME:alarm}
    password: ${SPRING_DATASOURCE_PASSWORD:alarm}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 20
      hibernate.order_updates: true
      hibernate.batch_versioned_data: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

alarm:
  dispatch:
    poll-interval-ms: 500
    batch-size: 20
    max-attempts: 5
    visibility-timeout-seconds: 60
    sweep-interval-ms: 10000
    backoff-base-ms: 1000
    backoff-max-ms: 1800000
    backoff-jitter-ratio: 0.2
